server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── React Router SPA fallback ──────────────────────────────────────────────
    # Any path that doesn't match a real file → serve index.html
    # This lets React Router handle /products, /cart, /login etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API Proxy (optional) ───────────────────────────────────────────────────
    # Uncomment if you want Nginx to proxy /api/* calls to the backend container
    # This avoids CORS issues and lets the frontend call /api instead of http://backend:8080/api
    # location /api/ {
    #     proxy_pass http://spring-app:8080/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # ── Cache static assets aggressively ──────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
}
